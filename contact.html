<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            Agri Information Hub
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="farming-guides.html">Farming Guides</a></li>

            <li><a href="pest-control.html">Pest Control</a></li>

        </ul>

    </nav>

</header>


<section class="page-banner">

    <h1>Contact Us</h1>

    <p>
        Contact us for agricultural information.
    </p>

</section>


<section class="contact-section">

    <h2>Send Us a Message</h2>


    <form onsubmit="submitForm(event)">

        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Message</label>

        <textarea
            id="message"
            placeholder="Write your message"
            required
        ></textarea>


        <button type="submit">
            Send Message
        </button>

    </form>

</section>


<footer>

    <p>
        © 2026 Agri Information Hub. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
